[pytest]
testpaths = tests
# Capture at the Python level only. The default fd-level capture swaps the process's
# stderr handle mid-run; Qt Multimedia's bundled FFmpeg keeps the old handle number, and
# once Windows reuses that number for a project database, FFmpeg's stream dump is written
# into the database file. That is how a test run once damaged a real project.
addopts = --capture=sys -p no:cacheprovider
filterwarnings =
    error::SyntaxWarning
